name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3
        with:
          job-id: morphe-build-v1

      - name: Prefetch Gradle
        # Fetches the wrapper's Gradle through GitHub's API when it is not cached,
        # because direct GitHub release links can fail while the API works.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prefetch_gradle.sh

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      # Semantic release runs its own Gradle build, which signs the bundle with
      # MORPHE_SIGNING_KEY. A separate build before it would leave a second .mpp
      # with the old version number in patches/build/libs.
      #
      # Android TV split: setting the repository variable TV_SOURCE (for example
      # semicoloncolonel/tv-morphe-patches) launches it. This release then builds
      # the phone-only bundle, and the steps after Attest publish the Android TV
      # bundle to that repository. Without TV_SOURCE, nothing changes: one
      # combined bundle, as before. See .github/TV_SOURCE_LAUNCH.md.
      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: release
        # The action installs semantic-release itself instead of using the
        # lockfile's copy, so the major version is pinned here.
        with:
          semantic_version: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_flavor: ${{ vars.TV_SOURCE != '' && 'phone' || 'all' }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Mobile Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Runs after Attest, because the clean removes the phone bundle.
      - name: Build the Android TV bundle
        id: tv
        if: vars.TV_SOURCE != '' && steps.release.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          ./gradlew :patches:clean :patches:buildAndroid -Pflavor=tv
          mkdir -p build/tv
          cp "patches/build/libs/patches-$VERSION.mpp" "build/tv/patches-$VERSION.mpp"

      - name: Attest the Android TV bundle
        if: steps.tv.outcome == 'success'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'TV Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: build/tv/patches-*.mpp

      # Publishes only when a file the TV bundle is built from changed since the
      # last TV release on this branch. TV_SOURCE_TOKEN needs Contents write
      # access to the TV repository.
      - name: Publish the Android TV bundle
        if: steps.tv.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.TV_SOURCE_TOKEN }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: >
          python3 .github/scripts/publish_tv_bundle.py
          --repo "${{ vars.TV_SOURCE }}"
          --branch "${{ github.ref_name }}"
          --version "$VERSION"
          --mpp "build/tv/patches-$VERSION.mpp"

      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean :patches:buildAndroid
          ./gradlew :patches:compileKotlin -Pflavor=phone
          ./gradlew :patches:compileKotlin -Pflavor=tv
